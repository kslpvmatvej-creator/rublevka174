<!doctype html>
<html lang="ru" class="bg-black">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?w=1200&q=80" fetchpriority="high" />
    <title>Rublevka174</title>
    <meta name="description" content="Детейлинг-студия Rublevka174, Челябинск: мойка, химчистка, полировка, бронирование кузова, оклейка плёнкой" />
    <!-- Заставка: решаем до первой отрисовки, показывать ли её (первый визит / не заходил 12 часов; ?splash — принудительно) -->
    <script>
      (function () {
        try {
          var r = document.documentElement
          var skip = location.hash === '#admin' || (!/[?&]splash\b/.test(location.search) && Date.now() - (+localStorage.getItem('rb-splash') || 0) < 432e5)
          if (skip) r.className += ' no-splash'
          else r.setAttribute('data-sp0', String(Math.round(performance.now())))
        } catch (e) {}
      })()
    </script>
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;touch-action:none;transition:opacity .6s ease,visibility .6s;animation:sp-failsafe .5s ease 7s forwards}
      #splash.sp-out{opacity:0;visibility:hidden;pointer-events:none}
      html.no-splash #splash{display:none}
      .sp-glow{position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(closest-side,rgba(59,130,246,.22),transparent);filter:blur(10px);animation:sp-glow 1.6s ease-out both}
      .sp-mark{position:relative;width:84px;height:84px;display:flex;align-items:center;justify-content:center}
      .sp-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
      .sp-ring circle{fill:none;stroke:#3b82f6;stroke-width:1.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:sp-draw 1s cubic-bezier(.65,0,.35,1) .1s forwards;filter:drop-shadow(0 0 6px rgba(59,130,246,.6))}
      .sp-r{font:600 34px/1 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;opacity:0;animation:sp-fade .5s ease .55s forwards}
      .sp-name{position:relative;margin-top:26px;display:flex;font:500 12px/1 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#e4e4e7;padding-left:.3em;overflow:hidden}
      .sp-name span{display:inline-block;opacity:0;transform:translateY(120%);animation:sp-rise .55s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(.5s + var(--i) * 45ms)}
      .sp-name::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:sp-sweep 1s ease 1s forwards;mix-blend-mode:overlay}
      .sp-line{position:relative;margin-top:30px;width:132px;height:2px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
      .sp-line i{position:absolute;inset:0;border-radius:2px;background:linear-gradient(90deg,#3b82f6,#93c5fd);transform:scaleX(0);transform-origin:left;animation:sp-fill 1.3s cubic-bezier(.45,0,.2,1) .1s forwards}
      @keyframes sp-draw{to{stroke-dashoffset:0}}
      @keyframes sp-fade{to{opacity:1}}
      @keyframes sp-rise{to{opacity:1;transform:none}}
      @keyframes sp-sweep{to{transform:translateX(120%)}}
      @keyframes sp-fill{to{transform:scaleX(1)}}
      @keyframes sp-glow{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
      @keyframes sp-failsafe{to{opacity:0;visibility:hidden;pointer-events:none}}
      @media (prefers-reduced-motion:reduce){
        .sp-glow,.sp-ring circle,.sp-r,.sp-name span,.sp-name::after,.sp-line i{animation:none}
        .sp-ring circle{stroke-dashoffset:0}.sp-r,.sp-name span{opacity:1;transform:none}.sp-name::after{display:none}.sp-line i{transform:none}
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-glow"></div>
      <div class="sp-mark">
        <svg class="sp-ring" viewBox="0 0 84 84"><circle cx="42" cy="42" r="40" pathLength="1"></circle></svg>
        <span class="sp-r">R</span>
      </div>
      <div class="sp-name">
        <span style="--i:0">R</span><span style="--i:1">u</span><span style="--i:2">b</span><span style="--i:3">l</span><span style="--i:4">e</span><span style="--i:5">v</span><span style="--i:6">k</span><span style="--i:7">a</span><span style="--i:8">1</span><span style="--i:9">7</span><span style="--i:10">4</span>
      </div>
      <div class="sp-line"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
